name: CI

on:
  push:
  pull_request:

jobs:
  construir-y-probar:
    runs-on: ubuntu-latest
    env:
      API_URL: http://localhost:5080
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Revisar estilo
        run: pnpm lint

      - name: Probar
        run: pnpm test

      - name: Compilar
        run: pnpm build
